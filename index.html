<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dobsonian Telescope 3D</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#020617;
    font-family:Arial,sans-serif;
    color:white;
}

#info{
    position:absolute;
    top:10px;
    left:10px;
    right:10px;

    background:rgba(0,0,0,0.55);

    padding:14px;

    border-radius:12px;

    z-index:10;

    line-height:1.5;
}

h2{
    margin-bottom:8px;
}

canvas{
    display:block;
}

</style>

</head>

<body>

<div id="info">

    <h2>DIY Dobsonian Telescope</h2>

    <p>
        Touch + drag to rotate<br>
        Pinch to zoom
    </p>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>

/////////////////////////
// SCENE
/////////////////////////

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x020617);

/////////////////////////
// CAMERA
/////////////////////////

const camera = new THREE.PerspectiveCamera(
    60,
    window.innerWidth/window.innerHeight,
    0.1,
    1000
);

camera.position.set(7,5,10);

/////////////////////////
// RENDERER
/////////////////////////

const renderer = new THREE.WebGLRenderer({
    antialias:true
});

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio,2)
);

document.body.appendChild(renderer.domElement);

/////////////////////////
// CONTROLS
/////////////////////////

const controls = new THREE.OrbitControls(
    camera,
    renderer.domElement
);

controls.enableDamping = true;

controls.enablePan = false;

/////////////////////////
// LIGHTS
/////////////////////////

const ambient = new THREE.AmbientLight(
    0xffffff,
    0.8
);

scene.add(ambient);

const directional = new THREE.DirectionalLight(
    0xffffff,
    1.2
);

directional.position.set(10,10,10);

scene.add(directional);

/////////////////////////
// GROUND
/////////////////////////

const ground = new THREE.Mesh(

    new THREE.PlaneGeometry(60,60),

    new THREE.MeshStandardMaterial({
        color:0x111111
    })

);

ground.rotation.x = -Math.PI/2;

ground.position.y = -2;

scene.add(ground);

/////////////////////////
// TELESCOPE GROUP
/////////////////////////

const telescope = new THREE.Group();

scene.add(telescope);

/////////////////////////
// TUBE
/////////////////////////

const tube = new THREE.Mesh(

    new THREE.CylinderGeometry(
        0.8,
        0.8,
        7,
        48
    ),

    new THREE.MeshStandardMaterial({
        color:0x222222,
        metalness:0.4,
        roughness:0.5
    })

);

tube.rotation.z = Math.PI/2.8;

tube.position.y = 1.8;

telescope.add(tube);

/////////////////////////
// PRIMARY MIRROR
/////////////////////////

const mirror = new THREE.Mesh(

    new THREE.CircleGeometry(
        0.72,
        48
    ),

    new THREE.MeshStandardMaterial({
        color:0x88ccff,
        emissive:0x113355,
        metalness:1,
        roughness:0.1
    })

);

mirror.rotation.y = Math.PI/2;

mirror.position.set(-2.8,0.7,0);

telescope.add(mirror);

/////////////////////////
// SECONDARY MIRROR
/////////////////////////

const secondary = new THREE.Mesh(

    new THREE.BoxGeometry(
        0.25,
        0.25,
        0.05
    ),

    new THREE.MeshStandardMaterial({
        color:0xcccccc
    })

);

secondary.position.set(2.1,2.8,0);

secondary.rotation.z = Math.PI/4;

telescope.add(secondary);

/////////////////////////
// EYEPIECE
/////////////////////////

const eyepiece = new THREE.Mesh(

    new THREE.CylinderGeometry(
        0.12,
        0.12,
        0.8,
        24
    ),

    new THREE.MeshStandardMaterial({
        color:0xb8860b
    })

);

eyepiece.rotation.z = Math.PI/2;

eyepiece.position.set(2.5,2.9,0);

telescope.add(eyepiece);

/////////////////////////
// WOOD BASE
/////////////////////////

const woodMaterial = new THREE.MeshStandardMaterial({
    color:0x6b3e1e
});

const leftSide = new THREE.Mesh(

    new THREE.BoxGeometry(
        0.3,
        2.5,
        3
    ),

    woodMaterial

);

leftSide.position.set(-0.8,-0.5,-1.3);

telescope.add(leftSide);

const rightSide = leftSide.clone();

rightSide.position.z = 1.3;

telescope.add(rightSide);

const bottom = new THREE.Mesh(

    new THREE.BoxGeometry(
        3,
        0.3,
        3
    ),

    woodMaterial

);

bottom.position.set(-0.8,-1.7,0);

telescope.add(bottom);

/////////////////////////
// STARS
/////////////////////////

const starGeometry = new THREE.BufferGeometry();

const starVertices = [];

for(let i=0;i<2500;i++){

    starVertices.push(
        (Math.random()-0.5)*200,
        (Math.random()-0.5)*200,
        (Math.random()-0.5)*200
    );

}

starGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(
        starVertices,
        3
    )
);

const stars = new THREE.Points(

    starGeometry,

    new THREE.PointsMaterial({
        color:0xffffff,
        size:0.15
    })

);

scene.add(stars);

/////////////////////////
// ANIMATION
/////////////////////////

function animate(){

    requestAnimationFrame(animate);

    telescope.rotation.y += 0.002;

    controls.update();

    renderer.render(
        scene,
        camera
    );

}

animate();

/////////////////////////
// RESIZE
/////////////////////////

window.addEventListener('resize',()=>{

    camera.aspect =
        window.innerWidth /
        window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );

});

</script>

</body>
</html>
